{% extends "lms/base.html" %}{% block lms_content %}<div class="lms-heading"><h1>첨삭 미리보기 준비</h1><a class="lms-btn" href="{% url 'lms:submission-review' submission.pk %}">제출물로 돌아가기</a></div><div class="lms-notice" role="alert">{{ error }}</div><section class="lms-panel"><h2>첨삭용 PDF 등록</h2><p>학생이 제출한 원본은 변경하지 않습니다. 같은 파일을 PDF로 저장해 등록하면 PDF 위에 첨삭할 수 있습니다. 업로드 전 원본과 내용·페이지가 일치하는지 확인하세요.</p><form method="post" enctype="multipart/form-data" action="{% url 'lms:prepare-submission' submission.pk %}" class="lms-form">{% csrf_token %}<input type="hidden" name="source" value="{{ source }}"><label for="preview-file">원본과 동일한 내용의 PDF</label><input id="preview-file" type="file" name="preview" accept=".pdf,application/pdf" required><button class="lms-btn primary">PDF 미리보기 등록</button></form></section>{% endblock %}
