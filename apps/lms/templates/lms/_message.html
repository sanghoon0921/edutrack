{% comment %}카카오톡식 메시지 한 줄. m = apps/lms/rooms.message_row (lms/js/messages.js 가 같은 모양으로 새 메시지를 그립니다).{% endcomment %}<article data-message-id="{{ m.id }}" data-sender="{{ m.sender_id }}" data-minute="{{ m.minute }}" data-day="{{ m.day }}" class="lms-message kt-msg{% if m.own %} own{% endif %}{% if m.first_in_run %} is-first{% endif %}{% if m.last_in_run %} is-last{% endif %}">{% if not m.own %}<strong class="kt-name">{{ m.sender }}</strong>{% endif %}<div class="kt-line"><p class="kt-bubble">{{ m.body|linebreaksbr }}</p><span class="kt-meta"><b class="kt-unread" aria-label="안 읽은 사람 {{ m.unread }}명"{% if not m.unread %} hidden{% endif %}>{{ m.unread }}</b><time>{{ m.time }}</time></span></div></article>
