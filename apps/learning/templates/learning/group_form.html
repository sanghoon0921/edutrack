{% extends "layouts/base.html" %}
{% block content %}
<section class="workflow-hero"><div><h1>그룹 수정</h1><p>그룹명과 정렬 순서를 수정합니다.</p></div></section>
<form method="post" class="workflow-panel workflow-form workflow-form-narrow">{% csrf_token %}{% for field in form %}<div class="workflow-field"><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% for error in field.errors %}<p class="field-error">{{ error }}</p>{% endfor %}</div>{% endfor %}<div class="workflow-actions"><a class="workflow-button is-ghost" href="{% url 'learning:group-manage' %}">취소</a><button class="workflow-button is-primary" type="submit">저장</button></div></form>
{% endblock %}
