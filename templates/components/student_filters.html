{% comment %}공용 학생 거르기 막대: 수업·반 드롭다운(전체 / 인트라넷 수업 / EduTrack 반) + 즉시 검색.
static/js/global/student-browser.js 의 EduStudentBrowser.mount 가 다룬다. directory=True 이면 선택용 버튼을 숨긴다.{% endcomment %}
<div class="ux-student-filters" data-student-browser data-browse-url="{% url 'students:selector-browse' %}" data-options-url="{% url 'students:selector-options' %}">
 <div class="ux-filter-row">
  <label><span>수업·반</span><select data-browse-scope aria-label="수업·반으로 거르기"><option value="">{% if selector.teacher_mode %}전체 (내 담당 범위){% else %}전체 학생{% endif %}</option></select></label>
  <label class="ux-grow"><span>이름·번호·학교</span><input type="search" name="q" value="{{ keyword|default:'' }}" data-browse-q placeholder="치는 즉시 목록이 바뀝니다" autocomplete="off" aria-label="학생 검색어"></label>
 </div>
 <div class="ux-filter-row">
  <button type="button" class="ux-text-btn" data-class-find hidden>수업 더 찾기</button>
  <label class="ux-grow" data-class-find-field hidden><span>수업명</span><input type="search" data-class-q placeholder="수업명 일부" autocomplete="off" aria-label="수업명으로 수업 찾기"></label>
 </div>
 <details data-extra-student-filter class="ux-filter-details"><summary>추가 조건 (학년·학교)</summary><div class="ux-filter-row"><label>학년<input type="text" data-browse-grade maxlength="30" placeholder="예: 10"></label><label>학교<input type="text" data-browse-school maxlength="100" placeholder="학교명"></label></div></details>
 {% if not directory %}<div class="ux-selector-controls"><button type="button" class="ux-text-btn" data-browse-all>검색된 학생 모두 추가</button></div>{% endif %}
 <div class="ux-results-meta"><p class="ux-hint" data-browse-status role="status" aria-live="polite">목록을 불러오는 중…</p><button type="button" class="ux-text-btn" data-browse-retry hidden>다시 시도</button>{% if not directory %}<div class="ux-pager"><button type="button" class="ux-btn" data-browse-prev disabled>‹ 이전</button><span class="ux-pages" data-browse-pages></span><button type="button" class="ux-btn" data-browse-next disabled>다음 ›</button><span class="ux-page-text" data-browse-page>1 / 1</span></div>{% endif %}</div>
</div>
