{% if show %}<nav class="et-pager" aria-label="{{ label }}">{% if caption %}<span class="et-pager-caption">{{ caption }}</span>{% endif %}{% if prev %}<a class="et-pager-step" href="{{ prev }}" aria-label="이전 쪽">‹ 이전</a>{% else %}<span class="et-pager-step is-disabled" aria-disabled="true">‹ 이전</span>{% endif %}<span class="et-pager-nums">{% for p in nums %}{% if p.current %}<span class="et-pager-num is-current" aria-current="page">{{ p.n }}</span>{% else %}<a class="et-pager-num" href="{{ p.href }}" aria-label="{{ p.n }}쪽">{{ p.n }}</a>{% endif %}{% endfor %}</span>{% if next %}<a class="et-pager-step" href="{{ next }}" aria-label="다음 쪽">다음 ›</a>{% else %}<span class="et-pager-step is-disabled" aria-disabled="true">다음 ›</span>{% endif %}</nav>{% endif %}
